[workspace]
resolver = "3"
members = ["crates/keri-store-redb", "crates/keri-watch", "crates/keri-watcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/AABelkhiria/keri-watcher"
keywords = ["keri", "watcher", "key-state", "duplicity", "identity"]
categories = ["cryptography"]

[workspace.dependencies]
keri-cesr = { version = "0.1.0", features = ["crypto"] }
keri-kel = "0.1.0"
keri-protocol = "0.2.0"
keri-store-redb = { version = "0.1.0", path = "crates/keri-store-redb" }
redb = "4.4.0"

axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

http-body-util = "0.1.5"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
